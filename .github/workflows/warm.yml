name: warm
# Lives on the main branch only. Downloads the Python libraries, the Kokoro voice model and the Whisper model once and
# saves them in GitHub's cache FROM main, because a cache saved on main is the only kind every job branch can read.
# Runs when cloud/requirements.txt changes on main, or by hand: gh workflow run warm.yml -R thejainbharat/faceless-render
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloud/requirements.txt', '.github/workflows/warm.yml']
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pip
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('cloud/requirements.txt') }}
      - run: pip install -q -r cloud/requirements.txt
      - if: steps.pip.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('cloud/requirements.txt') }}
      - id: kok
        uses: actions/cache/restore@v4
        with:
          path: ~/.faceless-shorts/kokoro
          key: kokoro-v1.0
      - id: wh
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
      - name: Download the models
        run: |
          python3 cloud/skill/voice.py --download
          python3 -c "from faster_whisper import WhisperModel; WhisperModel('small.en', device='cpu', compute_type='int8')"
          ls -la ~/.faceless-shorts/kokoro; du -sh ~/.cache/huggingface
      - if: steps.kok.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.faceless-shorts/kokoro
          key: kokoro-v1.0
      - if: steps.wh.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
